name: Build JARVIS Windows EXE
on:
  push:
    branches: ["jarvis-v2-piper", "main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name JARVIS jarvis.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/JARVIS.exe release/JARVIS.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: release/
